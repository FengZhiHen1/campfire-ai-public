# 仓库根 pyproject.toml —— uv 工作空间根与全局工程配置。
#
# 本仓库只有一个 Python 应用，位于 apps/api（两个运行入口：HTTP 与 Worker），
# 不拆多包工作空间；理由见 docs/项目结构设计.md 第 1 节第 3 条。
# 根目录本身不是包，因此本文件不声明 [project]，只作为虚拟工作空间根；
# 依赖清单属于应用，声明在 apps/api/pyproject.toml。

[tool.uv.workspace]
members = ["apps/api"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
# 三处测试树：应用测试（apps/api/tests）、仓库级工具测试（scripts/tests）、
# 评测工具测试（evaluation/carebench/tests）。评测工具测试全部是确定性替身，
# 不联网、不连库、不调模型，因此纳入默认收集，随 full/CI 一起跑。
testpaths = ["apps/api/tests", "scripts/tests", "evaluation/carebench/tests"]
# 归档代码不参与收集：archive/ 下为已废弃的旧实现与旧测试。
norecursedirs = ["archive", "node_modules", ".venv", "dist", "build", ".dsh", ".claude", ".agent"]
# `live_model` 的判定与开关在 `apps/api/tests/conftest.py`（默认跳过；显式开启时
# 缺环境直接失败）。这里登记 marker 只是让 `--strict-markers` 一类用法不至于把它
# 当成未注册的拼写错误。
markers = [
    "integration: 依赖真实 PostgreSQL/Redis 的集成测试（docker compose up -d）",
    "live_model: 真正调用外部模型供应商的用例（默认跳过；--live-model 或 CAMPFIRE_LIVE_MODEL=1 显式开启）",
]
# 事件循环作用域设为 session（2026-10-01）：pytest-asyncio 默认每个用例新建循环，
# 而 `core/db` 的共享引擎把连接池绑在首次使用时的循环上——跨循环复用会抛
# `RuntimeError: Event loop is closed`。此前各集成测试文件用「每个用例 dispose_engine」
# 绕开它，代价是每个用例都重建一次 TCP 连接（实测约 28 ms/用例）。
# 循环与整个会话同生命周期后，引擎可与循环一同存活，不再需要逐用例释放。
#
# 两个选项必须**同时**设为 session：只设 test 会让 async fixture 仍跑在 function
# 循环上，于是 fixture 与用例处于不同循环，跨循环问题原样复现。
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["apps/api/src/campfire"]
omit = ["archive/*"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
exclude = [
    ".agent",
    ".claude",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".tmp",
    ".venv",
    "__pycache__",
    "archive",
    "build",
    "dist",
    "node_modules",
    # 历史证据快照（2026-10-06 由 tmp/ 迁入）：证物不是产品代码，
    # 不参与 lint——改写它们以满足 import 排序等于篡改证据。
    "docs/证据",
    # 宣传片与视频制作工具（marketing/）：不是产品代码——apps/、scripts/、
    # infrastructure/ 对它零引用（已核）。其中的帧分析脚本属一次性探针，
    # 纳入 lint 会让每新增一个分析脚本都把后端 CI 判红（2026-10-07 实测 42 处）。
    "marketing",
]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402", "E501"]

[tool.ruff.lint.isort]
# 不加这条，ruff 会把 campfire 当第三方包，与 pytest 等合并成一块。
known-first-party = ["campfire"]
