[project]
name = "py-agent-kernel"
version = "0.1.0"
description = "通用 Agent 内核框架（内核+扩展架构，harness 层契约仿 pi，LLM 层委托 pydantic-ai）"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai==2.23.0",
    "pydantic>=2.13",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["py_agent_kernel"]
