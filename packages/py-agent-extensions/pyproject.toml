[project]
name = "py-agent-extensions"
version = "0.1.0"
description = "Campfire 领域扩展（单包多子包；扩展边界 = 机制模块边界）"
requires-python = ">=3.12"
dependencies = [
    "py-agent-kernel",
    "py-schemas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["py_agent_extensions"]

[tool.hatch.build.targets.wheel.force-include]
"py_agent_extensions/emergency/skills" = "py_agent_extensions/emergency/skills"
"py_agent_extensions/security" = "py_agent_extensions/security"
