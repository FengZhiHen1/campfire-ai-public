name: Deploy

# 发布链路（2026-10-01 重建）。
#
# ## 为什么是「手动触发」而不是「push master 自动发布」
#
# 旧链路在 push master 时自动对生产目录执行 `git reset --hard origin/master`，
# 再调用 `scripts/deploy-remote.sh`（2026-09-26 停用，脚本已随旧实现归档）。它有两个
# 结构性问题，重建时都不继承：
#
# 1. **硬重置生产目录**：任何在生产机上做过的、未提交的操作都会被无声抹掉，且失败时
#    目录停在半更新状态（文件已换、服务未重启）。镜像发布没有这个问题——镜像要么
#    完整推送成功，要么没有，生产目录始终由 compose 指向某个确定 tag。
# 2. **自动发布没有人工闸门**：master 上一次合并即上线。本项目尚未做发布验收，
#    因此恢复为**显式手动触发**（`workflow_dispatch`），由人决定何时发、发哪个提交。
#
# 旧文件的恢复条件（「目标实现落地并使 scripts/deploy-remote.sh 重新可用后，取消
# if: false」）已由本实现取代：**不再需要该脚本**，部署动作是「推送镜像 + 在目标机
# 上 compose pull/up」，由下方 job 直接表达，不引入第二份脚本真相。
#
# ## 未定项（如实声明，不编造）
#
# 目标服务器、域名与 TLS 证书在仓库中**不存在任何事实**（docs/服务器选型事实基线.md
# 与 docs/TODO.md 都写「未定」）。因此：
#
# - `build-and-push` **不依赖任何服务器**，只要本仓库即可运行、可验证；
# - `release` 需要下列 Secrets，缺失时它**不会静默跳过**——见该 job 的说明。
#
# 需要运维提供的 Secrets：
#   DEPLOY_HOST          目标服务器地址
#   DEPLOY_USER          部署用户
#   DEPLOY_SSH_KEY       部署私钥（OpenSSH 格式）
#   DEPLOY_PATH          服务器上的 compose 目录（含 docker-compose.prod.yml 与 .env.prod）
#   DEPLOY_KNOWN_HOSTS   目标主机公钥（用于 StrictHostKeyChecking；不要用 no-verify）
#
# ## 回滚
#
# 见 docs/运维/发布与回滚.md。要点：镜像按 git SHA 打 tag，回滚即把目标机的
# `IMAGE_TAG` 改回上一个 SHA 并 `compose up -d`；数据库**不做**自动 downgrade
# （理由见该文档），因此迁移必须保持向后兼容一版。

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "镜像 tag（默认取当前提交 SHA 前 12 位）"
        required: false
        type: string
      deploy:
        description: "推送到服务器（需先配好 DEPLOY_* Secrets；不勾选则只构建并推送镜像）"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# 发布不做并发：两次同时发布会让「哪一版在生产」失去确定答案。
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # GHCR 的镜像路径必须小写；仓库名含大写时直接拼会失败。
  IMAGE_BASE: ${{ github.repository }}

jobs:
  build-and-push:
    name: 构建并推送镜像到 GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 推送镜像需要它。只给这个 job，不给整个 workflow。
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      # 镜像仓库路径（不含 tag）。下游 `release` 要把它们写进目标机的 `.env.prod`，
      # 让 compose 的 `image:` 与实际推送的引用同名——否则 `pull` 拉不到（见 release 说明）。
      image_base: ${{ steps.repo.outputs.base }}
    steps:
      - uses: actions/checkout@v7

      - name: 计算镜像 tag
        id: tag
        # 默认取提交 SHA 前 12 位：它是**可回滚的锚点**（能从 tag 反查出是哪个提交），
        # 比 `latest` 或时间戳更有用。允许手动覆盖以便重发同一提交。
        run: |
          tag="${{ inputs.image_tag }}"
          if [ -z "$tag" ]; then
            tag="$(echo '${{ github.sha }}' | cut -c1-12)"
          fi
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "本次镜像 tag：$tag"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像路径统一小写（GHCR 要求）。用 shell 转换而不是依赖仓库名恰好小写。
      - name: 归一镜像路径为小写
        id: repo
        run: echo "base=$(echo '${{ env.IMAGE_BASE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: 构建并推送 API 镜像（HTTP 与 Worker 共用）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.base }}/api:${{ steps.tag.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.base }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建并推送 Web 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.web
          push: true
          # `VITE_API_DOMAIN` 是**构建期内联**的（见 Dockerfile.web 文件头第 2 条），
          # 因此它必须在构建时给出，不能靠运行时环境变量。取 PUBLIC_BASE_URL secret；
          # 未配置时回落到同源相对路径的占位（业务请求走同源，该值只用于
          # supertokens-web-js 的 init）。
          build-args: |
            VITE_API_DOMAIN=${{ secrets.PUBLIC_BASE_URL || 'https://localhost' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.base }}/web:${{ steps.tag.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.base }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 发布摘要
        run: |
          {
            echo "### 镜像已推送"
            echo ""
            echo "- tag: \`${{ steps.tag.outputs.image_tag }}\`"
            echo "- api: \`${{ env.REGISTRY }}/${{ steps.repo.outputs.base }}/api:${{ steps.tag.outputs.image_tag }}\`"
            echo "- web: \`${{ env.REGISTRY }}/${{ steps.repo.outputs.base }}/web:${{ steps.tag.outputs.image_tag }}\`"
            echo ""
            echo "回滚即把目标机 \`.env.prod\` 的 \`IMAGE_TAG\` 改回上一个 SHA。"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: 发布到服务器（需要 DEPLOY_* Secrets）
    needs: build-and-push
    # 只有显式勾选 deploy 才跑。**这不是「静默跳过」**：勾选与否是人做的一次显式选择，
    # 且默认值 false 意味着「只构建推送」是清晰可预期的行为，而不是「因为缺 secret
    # 所以什么也没发生」。若勾选了却缺 secret，下面的第一步会硬失败并点名缺哪个。
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      # ⚠️ **必须有这一条**（2026-10-01 自查发现）。
      #
      # 目标机要用 `GITHUB_TOKEN` 登录 GHCR 拉镜像。而 GitHub 的规则是：workflow
      # 一旦**显式声明** `permissions`，未列出的权限就全部是 `none`——顶层只给了
      # `contents: read`，因此本任务原本拿不到 `packages: read`。
      #
      # 包是私有的，缺这个权限时 `docker pull` 返回 403（不是「包不存在」这种好懂的
      # 报错，而是 `unexpected status from HEAD request ... 403 Forbidden`，看着像
      # 仓库路径写错了）。实测印证这条链路对权限敏感：用本机 token 登录 GHCR 成功，
      # 但 pull 同样 403，因为那个 token 也缺 `read:packages`。
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: 校验部署所需 Secrets 都已提供
        # 显式逐个点名，避免出现「连上了但路径不对」这类需要翻日志的失败。
        # 这是**故意会失败**的检查：勾了发布却没配 secret，就该停在这里。
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=""
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PATH DEPLOY_KNOWN_HOSTS; do
            if [ -z "$(printenv "$name")" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "缺少部署 Secrets：$missing" >&2
            echo "见本文件顶部「需要运维提供的 Secrets」一节。" >&2
            exit 1
          fi
          echo "部署 Secrets 齐备。"

      - name: 准备 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # 用固定的 known_hosts 而不是 StrictHostKeyChecking=no：后者会接受任何主机密钥，
          # 等于放弃对「连的是不是目标机」的校验。
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: 上传生产编排与运维脚本
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # 只上传编排、Docker 产物与运维脚本；`.env.prod` **不上传**（它含真实凭据，
          # 由运维在目标机上维护）。这样发布不会覆盖生产凭据。
          #
          # `scripts/` 必须上传：下面「发布前快照」这一步要在目标机上跑 `backup.sh`。
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          scp -i ~/.ssh/id_deploy -r \
            docker-compose.prod.yml infrastructure scripts \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod +x '$DEPLOY_PATH'/scripts/*.sh"

      - name: 登录 GHCR 并拉取新镜像
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          # 镜像仓库路径也要写进生产 `.env.prod`：compose 的 `image:` 由
          # `IMAGE_API`/`IMAGE_WEB` + `IMAGE_TAG` 拼成。此前 compose 写死本地名
          # （`campfire-api`），与 GHCR 上推的 `ghcr.io/<owner>/<repo>/api` 不同名，
          # `pull` 永远拉不到——发布链路根本不工作（2026-10-01 修正）。
          IMAGE_API: ${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.image_base }}/api
          IMAGE_WEB: ${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.image_base }}/web
        run: |
          # 目标机上执行：写入三个镜像变量，登录 GHCR，拉镜像。
          # 用 stdin 传脚本而不是把命令拼在命令行里——凭据不进入目标机的进程列表。
          #
          # 用 `sed` 就地改 `.env.prod` 的既有行；若该行不存在（首次部署）则追加，
          # 否则首发的 pull 会因为 compose 找不到镜像名而回落到本地构建。
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<REMOTE
          set -euo pipefail
          cd '$DEPLOY_PATH'
          set_kv() {
            key="\$1"; value="\$2"
            if grep -q "^\${key}=" .env.prod; then
              sed -i "s|^\${key}=.*|\${key}=\${value}|" .env.prod
            else
              printf '%s=%s\n' "\$key" "\$value" >> .env.prod
            fi
          }
          set_kv IMAGE_TAG '$IMAGE_TAG'
          set_kv IMAGE_API '$IMAGE_API'
          set_kv IMAGE_WEB '$IMAGE_WEB'
          echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin
          docker compose -f docker-compose.prod.yml --env-file .env.prod pull
          REMOTE

      - name: 发布前快照（迁移之前的回滚点）
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # 这一步是发布流程里**最不能省**的一步，理由：
          #
          # 迁移是本次发布中唯一**不可逆**的动作。镜像可以换回去，代码可以回滚，
          # 但 `alembic upgrade head` 删掉的一列、改掉的一个类型，回退不回来。
          # 因此必须在迁移之前留下一个可恢复的快照。
          #
          # 用仓库里的 `backup.sh`（不另写一份）——它已实测过：两个数据服务都触发
          # BGSAVE 并等 LASTSAVE 变化再拷，产物带 sha256，且会用 pg_restore --list
          # 校验转储可解析。这三条正是「快照可信」的判据。
          #
          # 快照失败即中止发布：一个「没有回滚点的迁移」比不发布更危险。
          #
          # 落盘位置用 DEPLOY_PATH 下的 backups/（与 compose 同目录，运维容易找到）；
          # 保留策略由运维按 docs/运维/发布与回滚.md 执行，脚本本身不删任何东西。
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && \
             ./scripts/backup.sh \
               --out-dir './backups' \
               --compose-file docker-compose.prod.yml \
               --env-file .env.prod"

      - name: 先迁移，再切流量
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # 顺序是刻意的：快照 → 迁移 → 切换。反过来（先切换）会让新代码先面对旧
          # schema 一段时间（那些请求要么 500、要么静默写错）。迁移必须保持向后兼容
          # 一版，这样「迁移完成、切换失败」时旧容器仍能正常工作。
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && \
             docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm api alembic upgrade head"

      - name: 启动新版本
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # `--no-build` 是刻意的（2026-10-01 真机踩到后加的）：
          #
          # compose 文件里 web/api 同时有 `build:` 与 `image:`。发布目录
          # `$DEPLOY_PATH` 只放 compose 与 infrastructure，**没有源码**
          # （build context 指向该目录，而那里没有 apps/）。默认行为下，若镜像
          # 因故没被拉到，`up -d` 会**回落到本地构建**——于是要么直接失败，
          # 要么更糟：复用上一次遗留的同名镜像，让「发布成功」的其实是很旧的版本，
          # 而日志看不出异常。
          #
          # 加上它之后，镜像缺失就**响亮地失败**，而不是静默用错版本。
          # 发布路径上「失败」永远优于「不确定地成功」。
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && \
             docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --no-build"

      - name: 发布验证：轮询 /readyz 直到就绪
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # 在目标机上从容器网络内部探——不依赖域名与 TLS 已就绪，因此这一步验的是
          # 「应用真的能服务」，而不是「DNS 与证书配好了没」。
          #
          # 判据用 /readyz 而不是 /livez：后者只看进程活着，一个「装配失败、核心端点
          # 必回 503」的版本在它眼里是健康的——那正是本项目修掉过的假健康。
          # 也刻意不用 /health：两者口径相同，但 /readyz 的名字表达了它是部署判据。
          #
          # 120 秒上界：镜像已拉好，`compose up -d` 后 start_period 是 40 秒。
          #
          # ⚠️ `--env-file .env.prod` **不能省**（2026-10-01 首次真实发布踩到）。
          #
          # 少它时 `docker compose exec` 在**解析 compose 文件阶段**就失败，因为文件里
          # 多处用了强制变量语法（`${POSTGRES_PASSWORD:?…}`、`${REDIS_PASSWORD:?…}`、
          # `${PUBLIC_BASE_URL:?…}` 等）。实测报错形如：
          #
          #     error while interpolating services.redis.command.[]:
          #     required variable REDIS_PASSWORD is missing a value
          #
          # 于是 `code` 恒为 `000`，循环 40 次后报「readyz 在 120 秒内未返回 200」——
          # **而应用其实是健康的**（同一时刻 `curl http://127.0.0.1/readyz` 返回 200，
          # 七个容器全部 healthy）。这是最坏的一类发布失败：它把「部署成功」报成失败，
          # 会诱使人去回滚一个本来正常的版本。
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd "${{ secrets.DEPLOY_PATH }}"
          for attempt in $(seq 1 40); do
            code=$(docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T api \
              curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/readyz || echo 000)
            if [ "$code" = "200" ]; then
              echo "readyz 返回 200（第 $attempt 次探测）"
              exit 0
            fi
            echo "第 $attempt 次：readyz 返回 $code，等待 3 秒"
            sleep 3
          done
          echo "发布验证失败：readyz 在 120 秒内未返回 200" >&2
          echo "--- api 容器最近日志 ---" >&2
          # 这一条同样必须带 `--env-file`：少了它，恰恰在「需要看日志」的时刻 compose
          # 会因为解析不出强制变量而报错，把真正的失败原因盖掉。`|| true` 只兜住退出码，
          # 兜不住「日志没打出来」。
          docker compose -f docker-compose.prod.yml --env-file .env.prod logs --tail 60 api >&2 || true
          echo "--- 请按 docs/运维/发布与回滚.md 回滚 ---" >&2
          exit 1
          REMOTE

      - name: 失败时提示回滚
        if: failure()
        run: |
          {
            echo "### 发布失败"
            echo ""
            echo "回滚步骤见 \`docs/运维/发布与回滚.md\`。最短路径："
            echo "把目标机 \`.env.prod\` 的 \`IMAGE_TAG\` 改回上一个 SHA，然后"
            echo "\`docker compose -f docker-compose.prod.yml --env-file .env.prod up -d\`。"
            echo ""
            echo "注意：**不要**用 \`alembic downgrade\` 回滚数据库（理由见该文档）。"
          } >> "$GITHUB_STEP_SUMMARY"
