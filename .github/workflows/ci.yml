name: CI

# 仓库结构见 docs/项目结构设计.md：唯一的 Python 应用在 apps/api（HTTP 与 Worker
# 两个入口），唯一前端在 apps/web。
#
# 分支策略见 AGENTS.md：dev 日常开发（本文件在此把关），master 仅保留稳定版本，
# 推送 master 由 deploy.yml 触发部署。原文件只在 main/master 上跑，dev 的开发提交
# 反而没有 CI，故补上 dev。
on:
  push:
    branches: [dev, main, master]
  pull_request:
    branches: [dev, main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-docs:
    name: 设计文档一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 检查逻辑只有一份，放在 scripts/ 里，CI 与本地跑的是同一个文件。
      - name: 校验相对链接、需求与验收的相互可解析、视觉契约 token
        run: python scripts/check_design_docs.py

  backend:
    name: 后端 lint 与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: 安装依赖（锁定版本，lock 过期即失败）
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: pytest
        run: uv run pytest

  # 前端作业待 apps/web 具备构建链后再加：
  #   pnpm install --frozen-lockfile && pnpm --filter web lint && pnpm --filter web build
  # apps/web 目前只有目录占位——视觉契约（docs/design/）未重建，故不引入构建链，
  # 详见 apps/web/README.md。
