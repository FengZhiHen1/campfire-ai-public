name: CI

# 仓库结构见 docs/项目结构设计.md：唯一的 Python 应用在 apps/api（HTTP 与 Worker
# 两个入口），唯一前端在 apps/web。
#
# 分支策略见 AGENTS.md：dev 日常开发（本文件在此把关），master 仅保留稳定版本，
# 推送 master 由 deploy.yml 触发部署。原文件只在 main/master 上跑，dev 的开发提交
# 反而没有 CI，故补上 dev。
on:
  push:
    branches: [dev, main, master]
  pull_request:
    branches: [dev, main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-docs:
    name: 设计文档一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 检查逻辑只有一份，放在 scripts/ 里，CI 与本地跑的是同一个文件。
      - name: 校验相对链接、需求与验收的相互可解析、视觉契约 token
        run: python scripts/check_design_docs.py

  backend:
    name: 后端 lint 与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: 安装依赖（锁定版本，lock 过期即失败）
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      # 类型检查是 NewType 语义类型（如 AccountId/PendingId/EpisodeUuid）的**唯一机器通道**。
      # 不跑它，那些类型就只是注释——混用不会被任何东西拦下（2026-09-29 评审指出）。
      #
      # 范围已放宽到整个 src 与整个 tests（2026-10-01）。此前只列 agent/core/
      # modules/memory/两个入口，把 modules/library 等排除在外，注释里写着「一旦 library
      # 修好应放宽为整体」——那 67 条 src 错误与 248 条 tests 错误在有类型检查之前
      # 没有机器看过，正是排除式范围的代价。现已全部修掉，故不再排除任何路径。
      #
      # 为什么 tests 也必须进：`py.typed` 加入 src 后，测试代码首次真正进入检查，
      # 暴露的错误里有一类是「测试替身不满足被替身对象的协议」（如 FakeSession 缺注解
      # 就不满足 SDK 的 Session 协议）——那类问题只在测试侧可见，而测试正是判据所在。
      #
      # 一次传 src+tests 两个路径（而不是分两次跑）：`tests/__init__.py` 让
      # `from .conftest import ...` 可解析；分开跑时若工作区出现按 `apps.api.tests.*`
      # 绝对导入的文件，mypy 会报「Source file found twice under different module names」
      # 并整体中止，那种中止会伪装成全绿（本次排查中确实误导过一次计数）。
      - name: mypy
        run: >
          uv run mypy
          apps/api/src/campfire
          apps/api/tests

      - name: pytest
        run: uv run pytest

  # 前端作业待 apps/web 具备构建链后再加：
  #   pnpm install --frozen-lockfile && pnpm --filter web lint && pnpm --filter web build
  # apps/web 目前只有目录占位——视觉契约（docs/design/）未重建，故不引入构建链，
  # 详见 apps/web/README.md。
