# 篝火智答唯一的 Python 应用：HTTP 与 Worker 两个运行入口共用一套代码。
#
# 依赖只声明「运行外壳当前真实消费的东西」。技术栈设计里已定但尚无消费者的
# 依赖（graphiti-core、supertokens-python、alembic）在各自消费者落地时再加入，
# 避免空壳依赖。LlamaIndex 三个包由 modules/library 的检索链消费（2026-09-29 加入）。

[project]
name = "campfire-api"
version = "0.1.0"
description = "篝火智答 API 与 Worker（单应用、两个运行入口）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "redis>=5.2",
    "taskiq>=0.11",
    "taskiq-redis>=1.0",
    "httpx>=0.28",
    "pyyaml>=6.0.3",
    "openai-agents>=0.22.3",
    "openai>=3.20.0",
    "llama-index-core>=0.14.25",
    "llama-index-vector-stores-postgres>=0.9.0",
    "llama-index-embeddings-openai>=0.7.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    # pyyaml 的类型存根：仅供 mypy 读取（skill frontmatter 解析用了 yaml），运行时不导入。
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/campfire"]
