# 篝火智答唯一的 Python 应用：HTTP 与 Worker 两个运行入口共用一套代码。
#
# 依赖只声明「运行外壳当前真实消费的东西」。技术栈设计里已定但尚无消费者的
# 依赖（openai-agents、taskiq 之外的队列扩展、graphiti-core、pgvector、
# supertokens-python、alembic）在各自消费者落地时再加入，避免空壳依赖。

[project]
name = "campfire-api"
version = "0.1.0"
description = "篝火智答 API 与 Worker（单应用、两个运行入口）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "redis>=5.2",
    "taskiq>=0.11",
    "taskiq-redis>=1.0",
    "httpx>=0.28",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/campfire"]
