# 篝火智答唯一的 Python 应用：HTTP 与 Worker 两个运行入口共用一套代码。
#
# 依赖只声明「运行外壳当前真实消费的东西」。技术栈设计里已定但尚无消费者的
# 依赖在各自消费者落地时再加入，避免空壳依赖：LlamaIndex 三个包由 modules/library
# 的检索链消费（2026-09-29 加入）；graphiti-core 由 modules/memory 消费（2026-09-29 加入）；
# supertokens-python 仍未加入（surfaces/accounts 尚未落地）。
#
# graphiti-core 为什么额外声明 httpx：它 import httpx 却**没有把它写进依赖**
# （实测 0.30.2：只有 neo4j/numpy/openai/posthog/pydantic/python-dotenv/tenacity），
# 缺它会在 `import graphiti_core` 时直接 ModuleNotFoundError。本项目本就依赖 httpx，
# 因此实际不缺；uv 也会把它记进 graphiti-core 的依赖闭包（见 uv.lock 的 requires-dist）。
#
# 为什么还声明 httpx2（2026-09-29）：modules/memory 显式构造 http 客户端并注入给两个
# openai 客户端（避免改写 os.environ 来绕过宿主机的代理豁免表，见 graph.py 说明）。
# **openai 实际用的是 httpx2**（实测 openai 3.x 的依赖是 `httpx2<3,>=2.12.0`，
# 且 `openai._base_client.httpx2` 指向它），注入的客户端必须是 httpx2 的类型。
# 它此前只是传递依赖：直接 import 而不声明，会在上游改依赖时以 ImportError 形式
# 突然断裂，因此按「直接使用即直接声明」补上。

[project]
name = "campfire-api"
version = "0.1.0"
description = "篝火智答 API 与 Worker（单应用、两个运行入口）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "redis>=5.2",
    "taskiq>=0.11",
    "taskiq-redis>=1.0",
    "httpx>=0.28",
    "httpx2>=2.12",
    "pyyaml>=6.0.3",
    "openai-agents>=0.22.3",
    "openai>=3.20.0",
    "llama-index-core>=0.14.25",
    "llama-index-vector-stores-postgres>=0.9.0",
    "llama-index-embeddings-openai>=0.7.0",
    "alembic>=1.20.0",
    "pgvector>=0.5.0",
    "graphiti-core[falkordb]>=0.30.2",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    # pyyaml 的类型存根：仅供 mypy 读取（skill frontmatter 解析用了 yaml），运行时不导入。
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/campfire"]
