# 生产 Nginx：单一对外入口，同时承担 SPA 静态服务与后端反代。
#
# 为什么反代与静态在同一份配置里（而不是两个容器两份配置）：
# 前端业务请求走**同源相对路径**（`credentials: 'same-origin'`，实测
# `apps/web/src/infrastructure/http/client.ts`），因此「哪些路径去后端、其余交给 SPA」
# 这条路由表必须是唯一的。拆成两份配置就会出现两个地方各自决定 `/consult` 的归属。
#
# 三条不能省的设置与理由：
#
# 1. **SSE 路径必须关 buffering**。契约要求 `: ping` 心跳每 15 秒（原文「仅防代理超时」），
#    单次运行上限 180 秒。Nginx 默认 `proxy_buffering on` 会把事件攒在缓冲区里，
#    客户端于是「很久没反应、然后一次收到一大段」——心跳也失去防超时的意义。
#    同理 `proxy_read_timeout` 必须长于 180 秒：默认 60 秒会在运行中途切断长回答。
#
# 2. **`/readyz` 与 `/health` 对外可达**（上游检查需要），但**不缓存**：
#    健康结论必须每次都真探测，缓存会让「上一秒健康」掩盖当前故障。
#
# 3. **`/livez` 不转发到后端也可以**，但这里仍然转发——保持「所有后端路径同一处理」
#    比在 Nginx 里再造一份路径清单更不容易漂移。
#
# 未定项（如实声明，不编造）：域名、TLS 证书来源与路径在仓库中**不存在任何事实**
# （docs/服务器选型事实基线.md 与 docs/TODO.md 都写「未定」）。因此：
# - `server_name` 用占位符 `_`（匹配任意 Host），运维按实际域名替换；
# - TLS 的 server 块**默认关闭**（整段注释），证书就位后取消注释并填路径。
# 这样镜像在没有证书的环境里也能启动，而不是启动即崩。

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式带 request_time：SSE 的时长分布是排查「回答很慢」的第一手数据。
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # 前端产物是 hashed 文件名，压缩收益明显且无副作用。
    gzip  on;
    gzip_types  text/plain text/css application/javascript application/json
                image/svg+xml application/xml;

    # 上传体积上界：API 侧没有文件上传端点（资料摄取走 CLI），因此给一个小上界，
    # 避免把大 body 直接转给后端内存。
    client_max_body_size  2m;

    # Docker 内置 DNS。用它而不是静态 upstream，理由见下方 `set $campfire_api` 的说明。
    # Docker 内置 DNS（`127.0.0.11` 是 Docker 的嵌入式解析器）。用它是因为下面把上游
    # 写成变量，而变量形式的 `proxy_pass` 需要显式 resolver 才能解析主机名。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- HTTP：默认只用于健康检查与（未启用 TLS 时的）直连 ---
    server {
        listen       80;
        # 占位：运维按实际域名替换（见文件头「未定项」）。
        server_name  _;

        # 后端上游地址。写成变量（而不是 `upstream` 块）的理由：
        #
        # 静态 `upstream { server api:8000; }` 在 **nginx 启动时只解析一次**并缓存 IP。
        # 本部署形态是单机 compose，发布时会**重建 api 容器**，重建后容器 IP 会变——
        # 那时 nginx 若没被一起重启，就会一直把请求发往已不存在的旧 IP，表现为
        # 持续 502，直到有人手动 reload。用变量后按 `valid=10s` 重新解析，最多 10 秒自愈。
        #
        # 代价（如实写明）：失去 `upstream` 块的 `keepalive` 连接复用，每次请求新建到
        # 后端的连接。对这个应用可接受的理由：SSE 是长连接（一次运行一条），普通 API
        # 请求在容器网络内的建连成本可忽略；而「发布后稳定 502」的代价远大于那点开销。
        set $campfire_api "api:8000";

        # 健康检查：不缓存（见文件头第 2 条）。
        location = /livez {
            proxy_pass         http://$campfire_api;
            proxy_set_header   Host $host;
            add_header         Cache-Control "no-store" always;
        }
        location = /readyz {
            proxy_pass         http://$campfire_api;
            proxy_set_header   Host $host;
            add_header         Cache-Control "no-store" always;
        }
        location = /health {
            proxy_pass         http://$campfire_api;
            proxy_set_header   Host $host;
            add_header         Cache-Control "no-store" always;
        }

        # SSE 运行事件流（见文件头第 1 条）。
        # 单独一条 location 而不是并入 `/api`：只有这一条路径需要关缓冲与长超时，
        # 把那些设置套到整个 `/api` 上会让普通 JSON 端点也失去缓冲带来的吞吐收益。
        #
        # 正则 location 的优先级高于下面 `location /api/` 的前缀匹配，因此这条会先命中——
        # 这正是要它的原因（前缀 location 无法表达更细的路径规则）。
        location ~ ^/api/consult/runs/[^/]+/stream$ {
            proxy_pass         http://$campfire_api;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   Connection "";
            # 关键：不缓冲，事件产生即下发。这一条已实测（不是照惯例抄的）：
            # 用一个每 0.4 秒发一条的假 SSE 上游（5 条）经本文件反代，事件到达时刻为
            # +0.02/+0.42/+0.81/+1.22/+1.61 秒，与上游节奏一致；把本行删掉、其余不动，
            # 同样 5 条全部挤在 +2.02 秒一次性到达（首末间隔 0.00 秒）。两组的 HTTP 状态码
            # 都是 200，任何一侧都不报错——所以这条只能靠到达时刻判，不能靠状态码。
            proxy_buffering    off;
            proxy_cache        off;
            # 关掉响应压缩对 SSE 的干扰：压缩会引入自己的缓冲。
            gzip               off;
            # 长于单次运行上限（180 秒），留出余量。
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            # 不缓存。
            add_header         Cache-Control "no-store" always;
            # 关闭 Nginx 自己给上游请求加的超时重试：SSE 重试会重复消费事件。
            proxy_next_upstream off;
        }

        # 后端 API：全部在 `/api` 下（含 SuperTokens 的 `/api/auth/*`）。
        #
        # 为什么是 `/api` 而不是按面列举（`^/(auth|consult|profile|memory|library)`）——
        # 那是 2026-10-01 实测到的缺陷：正则 location 的优先级高于 SPA 的 `location /`，
        # 而前端**页面路由**用了同样的前缀（`/consult`、`/profile`、`/consult/emergency`），
        # 于是这些页面被转发给 API（实测 404/405 JSON），用户打开对话页或档案页看到的是
        # 裸 API 错误。现在接口在 `/api/consult`、页面在 `/consult`，结构上不可能再相撞；
        # 也不再需要「新增一个面就要记得改这条正则」。
        #
        # 前缀大小写敏感是刻意的：`/API/...` 不该被当作接口。
        location /api/ {
            proxy_pass         http://$campfire_api;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            # 协议要传给后端：SuperTokens 据它做 cookie 的 secure 判定，
            # 缺了它 https 站点会拿到非 secure cookie。
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection "";
        }

        # `/api` 本身（无尾斜杠）也转给后端，让它回后端的 404 而不是落到 SPA
        # （落到 SPA 会返回 index.html 200，让一个拼错的前缀看起来「通了」）。
        location = /api {
            proxy_pass         http://$campfire_api;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # SPA：其余路径交给前端路由（React Router），未命中的文件回 index.html。
        location / {
            root       /usr/share/nginx/html;
            index      index.html;
            try_files  $uri $uri/ /index.html;

            # index.html 不缓存：它引用 hashed 资源，缓存它会让用户长期用旧版本。
            location = /index.html {
                add_header Cache-Control "no-cache, must-revalidate" always;
            }
        }

        # hashed 静态资源可长期缓存（内容变了文件名就变）。
        location /assets/ {
            root               /usr/share/nginx/html;
            expires            1y;
            add_header         Cache-Control "public, immutable" always;
            access_log         off;
        }
    }

    # --- HTTPS：证书就位后取消注释（见文件头「未定项」）---
    #
    # 刻意默认关闭：仓库里没有任何证书，且 .gitignore 已忽略 `**/nginx/ssl/`、`*.pem`、
    # `*.key`、`*.crt`。默认开启会让镜像在没有证书的环境启动即崩——那比「HTTP 可用、
    # TLS 待运维补齐」更糟。
    #
    # server {
    #     listen               443 ssl;
    #     http2                on;
    #     server_name          _;   # 换成实际域名
    #
    #     ssl_certificate      /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key  /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols        TLSv1.2 TLSv1.3;
    #     ssl_ciphers          HIGH:!aNULL:!MD5;
    #     ssl_session_cache    shared:SSL:10m;
    #     ssl_session_timeout  10m;
    #
    #     # 健康检查、SSE、API 与 SPA 四段与上面的 80 端口 server 相同，
    #     # 直接复制那四个 location 即可（不要在这里重新设计路由表）。
    # }
}
