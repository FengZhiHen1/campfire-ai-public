# ============================================================
# 篝火智答 (Campfire-AI) — 生产 Nginx
#
# 唯一对外入口：SPA 静态托管 + API/SSE 反代。TLS 终止在这里。
#
# 本文件被整体挂载为 `/etc/nginx/nginx.conf`（见 Dockerfile.web）。
#
# 设计要点（每条都对应一个实测结论或已修缺陷）：
#
# 1. **SSE 必须关缓冲**。默认 `proxy_buffering on` 会把事件攒在缓冲区里，
#    表现为「回复一次性蹦出来」而不是逐字出现——而 HTTP 状态码仍是 200，
#    从状态码、日志、错误信息上完全看不出来。已实测：同一份配置只删掉
#    `proxy_buffering off` 一行，5 条事件从「间隔 0.4 秒逐条到达」变成
#    「全部挤在 2.02 秒一次性到达」。
#
# 2. **健康检查路径不缓存**。缓存会让「已恢复」与「已故障」的状态互相污染。
#
# 3. **上游写成变量**而不是 `upstream` 块。静态 upstream 在 nginx 启动时只解析
#    一次并缓存 IP；本部署发布时会重建 api 容器、容器 IP 会变，此时 nginx 若
#    未重启就会一直发往旧 IP（持续 502，直到手动 reload）。用变量 + resolver
#    按 10 秒重新解析，最多 10 秒自愈。代价是失去 upstream 的 keepalive 复用。
#
# 4. **路由表抽到 app-locations.conf**，80 与 443 共用。复制两份必然漂移，
#    症状是「HTTPS 下某端点 404 而 HTTP 正常」，很难联想到是配置重复所致。
#
# 5. **HTTPS 由 ssl.d 片段启用**，本文件不含 443 的 server 块。理由见文末说明。
# ============================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式带 request_time：SSE 的时长分布是排查「回答很慢」的第一手数据。
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # 前端产物是 hashed 文件名，压缩收益明显且无副作用。
    gzip  on;
    gzip_types  text/plain text/css application/javascript application/json
                image/svg+xml application/xml;

    # 上传体积上界：API 侧没有文件上传端点（资料摄取走 CLI），因此给一个小上界，
    # 避免把大 body 直接转给后端内存。
    client_max_body_size  2m;

    # Docker 内置 DNS（`127.0.0.11` 是 Docker 的嵌入式解析器）。用它是因为下面把上游
    # 写成变量，而变量形式的 `proxy_pass` 需要显式 resolver 才能解析主机名。
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        # 只监听 80：这里承担 ACME HTTP-01 挑战与 HTTP 直连。
        listen       80;
        listen       [::]:80;
        server_name  campfire.wenran.me _;

        # 后端上游地址。写成变量（而不是 `upstream` 块）的理由见文件头第 3 条。
        set $campfire_api "api:8000";

        # ACME HTTP-01 挑战的 webroot。用 `^~` 前缀匹配确保它**优先于**任何正则
        # location（包括 SSE 那条）与 SPA 的 `location /`——否则验证文件会被
        # 反代或 index.html 抢走，签发失败。
        #
        # 用 webroot 而不是 DNS-01：DNS 方式要把 Cloudflare Token 放到服务器上，
        # 而该 Token 对整个 zone 有 DNS 编辑权（含其它 10 条记录）——为签一张证书
        # 把全 zone 的写权限放到公网机器上，代价远大于收益。
        location ^~ /.well-known/acme-challenge/ {
            root      /var/www/certbot;
            default_type "text/plain";
            access_log off;
        }

        # HTTP → HTTPS 跳转，**由部署流程在确认 443 真的可达之后**写入该文件。
        #
        # 为什么不直接在这里写 `return 301`（2026-10-01 真机踩到）：
        # 本机部署时 443 被云安全组拦着（80 通、443 超时，服务器访问自己的公网 IP
        # 也是同样结果），此时若 80 无条件跳 443，站点会从「能用」变成「完全打不开」。
        # 而跳转该不该加，取决于一个**部署期事实**（443 是否可达），不是配置期常量。
        #
        # 通配 include 在目录为空时不报错（实测 `nginx -t` 通过），因此文件不存在
        # 就是「不跳转」，存在就是「跳转」。这样 HTTPS 未就绪时站点仍可用，
        # 就绪后放一个文件进去、reload 即启用。
        include /etc/nginx/redirect.d/*.conf;

        # 应用路由表（与 HTTPS 完全一致，两处 include 同一个文件）。
        include /etc/nginx/app-locations.conf;
    }

    # HTTPS 由 ssl.d 片段提供，例如：
    #   /etc/nginx/ssl.d/campfire.conf
    # 该片段里写 443 的 server 块（证书路径 + 同样的 include app-locations.conf）。
    #
    # 为什么要拆出来（不是偷懒）：证书是**运维产物**（Let's Encrypt 签发、有有效期、
    # 需续期），不是仓库产物——`.gitignore` 已忽略 `**/nginx/ssl/`、`*.pem`、`*.key`。
    # 把 443 的 server 块写死在仓库里，就必须在签发证书**之前**保证证书存在，
    # 否则 nginx 启动即崩：首次部署会陷入「要先有证书才能起 nginx，要先起 nginx
    # 才能签证书」的死循环。
    #
    # 拆出后：无证书时通配 include 匹配零个文件，nginx 照常启动并提供 HTTP；
    # 证书签发完成后放入片段、reload 即启用 HTTPS。实测空目录下该 include 不报错。
    #
    # 同理，**80 → 443 的跳转也放在 ssl.d 片段里**：在证书真的可用之前加跳转，
    # 会把「HTTP 可用」变成「什么都打不开」。
    include /etc/nginx/ssl.d/*.conf;
}
