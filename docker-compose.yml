# ============================================================
# 篝火智答 (Campfire-AI) — 本地开发基础设施编排
# 启动：docker compose up -d
# 停止：docker compose down
#
# dev 环境只编排数据服务；api、worker、web 直接在宿主机上运行。
# 默认 `up` 拉起四个数据服务：PostgreSQL、Redis、FalkorDB、SuperTokens core。
# MinIO 一期不依赖（一期需求无附件），且上游已下架公开镜像 ⇒ 放在
# `attachments` profile 下，默认不启动（原因见下方 minio 服务处的注释）。
#
# 部署目标（api、web、worker、nginx 入编排）见 docs/技术栈设计.md 第 6 节；
# 那是另一份产物，本文件只覆盖本地开发。
#
# ⚠️ 端口一律绑回环（`127.0.0.1:`），**不得省略**：
# 这些服务大多没有强凭据（FalkorDB 与 Redis 默认无密码、MinIO 默认 minioadmin），
# 而本文件是仓库里唯一的编排。绑 0.0.0.0 时，同一网段的任何主机都能直连
# ——SuperTokens core 官方文档明确警告：core 暴露到互联网则「任何人都能创建或
# 修改 dashboard 用户」；PostgreSQL 的 5432 更是全部业务数据与会话表。
# 绑回环对本地开发**零影响**：api/worker 跑在宿主机、经 localhost 连（见
# core/config.py 的默认值），容器之间走 compose 服务名而非宿主端口。
# 若确实需要从局域网访问某个服务，请只针对该服务显式放开，并先补上凭据。
#
# ⚠️ 这份编排**不是部署产物**：真部署编排须满足 docs/技术栈设计.md 第 6 节
# 的约束（数据服务不对外暴露、仅经容器内网互联、所有模板占位符必须替换）。
# ============================================================

services:
  # --- PostgreSQL 17 + pgvector ---
  # SuperTokens core 的表也在本库内（见 docs/技术栈设计.md 第 4 节）。
  postgres:
    image: pgvector/pgvector:pg17
    container_name: campfire-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: campfire
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campfire"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Redis 7 ---
  # 缓存、限流与 Taskiq broker 的队列。
  redis:
    image: redis:7-alpine
    container_name: campfire-redis
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- FalkorDB（通用记忆的图库后端，Graphiti 需要）---
  # 版本说明：设计文档写作「FalkorDB 1.1.2 容器」，但该镜像仓库（falkordb/falkordb）
  # 的真实 tag 是 4.x 系列（v4.20.7 为当前稳定版），**不存在 1.1.2 这个 tag**；
  # 「1.1.2」疑为 falkordb Python 客户端的版本。此处按镜像实际存在的 tag 固定，
  # 该措辞差异已登记待确认。
  # 端口用 6380，避免与 Redis 的 6379 撞车。
  falkordb:
    image: falkordb/falkordb:v4.20.7-alpine
    container_name: campfire-falkordb
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - falkordb_data_dev:/data
    healthcheck:
      # FalkorDB 是 Redis 分支，redis-cli 随镜像提供。
      # ⚠️ 未实测：本次改动时 Docker daemon 未运行，无法启动容器核对。
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- SuperTokens core（独立 Java HTTP 服务）---
  # 会话校验在 Python SDK 内完成、不经过 core；core 只在注册、登录、重置、刷新时
  # 被调用（见 docs/技术栈设计.md 第 2 节）。
  # ⚠️ 已知风险：core 会在本库内建自己的表，而 Alembic 的 --autogenerate 会把
  # 这些表当成「该删除的对象」。接入迁移前必须为 autogenerate 排除这些表，
  # 否则一次自动生成就会产出删表迁移。此项已登记待确认。
  supertokens:
    image: supertokens/supertokens-postgresql:12.2.0
    container_name: campfire-supertokens
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRESQL_CONNECTION_URI: postgresql://${POSTGRES_USER:-campfire}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-campfire}
      API_KEYS: ${SUPERTOKENS_API_KEY}
    ports:
      - "127.0.0.1:3567:3567"
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- MinIO 对象存储（一期不依赖，且**默认不启动**）---
  # 一期需求无附件，因此本服务**当前无消费者**：它只有风险、没有收益
  # （9001 是管理 console，默认凭据 minioadmin/minioadmin）。
  # 保留在编排里是为了开放附件时可直接启用；**部署编排不应包含它**。
  #
  # ⚠️ 2026-10-15 起本服务放在 `attachments` profile 下，默认 `up` **不拉起它**。
  #
  # 镜像来源（2026-10-15 实测）：上游 MinIO 已下架全部公开镜像——
  # `docker pull minio/minio`（:latest 与任意 RELEASE.* tag）、`quay.io/minio/minio`、
  # `ghcr.io/minio/minio` 全部失败，**没有可钉的 tag**。故改用 Chainguard 的社区构建
  # （Wolfi 基底，含上游 MinIO RELEASE.2026-09-22T19-25-18Z，非上游官方产物）：
  # 按 digest 钉版，可复现且与多架构索引一致；它仍在持续重建（本固定版构建于 2026-10-13）。
  # 未选 `bitnamilegacy/minio`：实测按本编排的启动参数直接 FATAL（Unable to initialize
  # backend），且该仓库是停更的遗留快照。
  # 换镜像时注意健康检查：Chainguard 镜像内**没有 curl/wget**，故 healthcheck 改为
  # 用镜像自带的 bash `/dev/tcp` 做 9000 端口连通性探测（不是 HTTP 语义探测）。
  minio:
    profiles: ["attachments"]
    image: cgr.dev/chainguard/minio@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    container_name: campfire-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      # MinIO Docker 镜像使用 MINIO_ROOT_USER/PASSWORD，
      # 映射 .env 中的 MINIO_ACCESS_KEY/SECRET_KEY
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data_dev:/data
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata_dev:
  redis_data_dev:
  falkordb_data_dev:
  minio_data_dev:
