# 应用路由表（HTTP 与 HTTPS 共用）。
#
# 为什么单独成文件：80 与 443 两个 server 块必须提供**完全一样**的路由（健康检查、
# SSE、API、SPA、静态资源）。复制两份必然漂移——改了 80 忘了改 443，症状是
# 「HTTPS 下某个端点 404 而 HTTP 下正常」，很难第一时间想到是配置重复所致。
# 抽成一个文件、两处 `include`，结构上就不可能不一致。
#
# 本文件被 `include` 进 server 块内部，因此这里只写 location，不写 server。
#
# 后端上游地址由包含方通过 `set $campfire_api` 提供（变量形式的 proxy_pass 需要它，
# 理由见 nginx.conf 里的说明）。

# 健康检查：不缓存。
#
# 注意这几个探针 location 都是**反代到后端**的，因此它们证明的是「nginx + 后端」，
# 不是「nginx 自己」。web 容器的 healthcheck 需要后者——见下面 `/nginx-health`。
#
# 分两类，判据不同（`/readyz/deep` 那一类见它自己上方的注释）：
#   - `/livez`、`/readyz`、`/health`：**周期性**判据（容器 healthcheck、CD 发布轮询）；
#   - `/readyz/deep`：**按需**判据（发布验收、人工诊断），因为它有配额成本。
location = /livez {
    proxy_pass         http://$campfire_api;
    proxy_set_header   Host $host;
    add_header         Cache-Control "no-store" always;
}
location = /readyz {
    proxy_pass         http://$campfire_api;
    proxy_set_header   Host $host;
    add_header         Cache-Control "no-store" always;
}
# 深度就绪探针（`campfire.main` 的 `/readyz/deep`）：按需调用，**不进周期健康检查**。
#
# **为什么必须是独立一条**：上面那条用的是 `location =`，即**精确匹配**——它只匹配
# `/readyz` 这一个 URI，**不覆盖任何子路径**。因此缺了本块时 `/readyz/deep` 会落到
# 最下面的 SPA `location /`，被 `try_files` 回成 `index.html` ⇒ **HTTP 200 + HTML**。
# 这比 404 更难辨认：404 说明「没有这个端点」，而 200 看起来像「端点通了」，调用方会把
# 一页 HTML 读成「深探针可用」。已实测（2026-10-05：本文件不含本块时 `/readyz/deep`
# 回 `Content-Type: text/html` + SPA 正文，`/readyz` 回 `application/json`）。
#
# **为什么不能再加进任何周期健康检查**（成本纪律，`campfire.main` 的 docstring 有同一论证）：
# 它会**真的调用一次供应商的嵌入端点**（这是它存在的全部理由——`/readyz` 的 `model` 项
# 只探 chat 端点，抓不到嵌入链路的参数级缺陷）。生产 healthcheck 是**每 15 秒**一次，
# 放进去约等于 **5760 次/天**的配额消耗。因此它只在**发布验收与人工诊断**时按需调用；
# `docker-compose.prod.yml`、CD 的发布轮询与 `scripts/acceptance_probe.py` 都继续用 `/readyz`。
location = /readyz/deep {
    proxy_pass         http://$campfire_api;
    proxy_set_header   Host $host;
    add_header         Cache-Control "no-store" always;
}
location = /health {
    proxy_pass         http://$campfire_api;
    proxy_set_header   Host $host;
    add_header         Cache-Control "no-store" always;
}

# nginx **自己**的存活端点：由 nginx 直接应答，不碰后端。
#
# 为什么需要它（2026-10-01 真机部署时发现）：web 容器的 healthcheck 原本打
# `/livez`，而那是反代到 api 的——于是「后端挂了」会把 web 容器标成 unhealthy，
# 与代码注释宣称的「只证明 nginx 在服务」正好相反。重启一个本身没坏的 nginx
# 没有意义（这正是区分 livez/readyz 的理由），所以这里给一个真正本地的端点。
#
# `return 200` 不读磁盘、不碰上游，因此它只反映 nginx 进程能否应答。
location = /nginx-health {
    access_log off;
    add_header  Cache-Control "no-store" always;
    return 200 "ok\n";
}

# SSE 运行事件流（见 nginx.conf 文件头第 1 条）。
# 单独一条 location 而不是并入 `/api`：只有这一条路径需要关缓冲与长超时，
# 把那些设置套到整个 `/api` 上会让普通 JSON 端点也失去缓冲带来的吞吐收益。
#
# 正则 location 的优先级高于下面 `location /api/` 的前缀匹配，因此这条会先命中——
# 这正是要它的原因（前缀 location 无法表达更细的路径规则）。
location ~ ^/api/consult/runs/[^/]+/stream$ {
    proxy_pass         http://$campfire_api;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   Connection "";
    # 关键：不缓冲，事件产生即下发。这一条已实测（不是照惯例抄的）：
    # 用一个每 0.4 秒发一条的假 SSE 上游（5 条）经本文件反代，事件到达时刻为
    # +0.02/+0.42/+0.81/+1.22/+1.61 秒，与上游节奏一致；把本行删掉、其余不动，
    # 同样 5 条全部挤在 +2.02 秒一次性到达（首末间隔 0.00 秒）。两组的 HTTP 状态码
    # 都是 200，任何一侧都不报错——所以这条只能靠到达时刻判，不能靠状态码。
    proxy_buffering    off;
    proxy_cache        off;
    # 关掉响应压缩对 SSE 的干扰：压缩会引入自己的缓冲。
    gzip               off;
    # 长于单次运行上限（180 秒），留出余量。
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # 不缓存。
    add_header         Cache-Control "no-store" always;
    # 关闭 Nginx 自己给上游请求加的超时重试：SSE 重试会重复消费事件。
    proxy_next_upstream off;
}

# 后端 API：全部在 `/api` 下（含 SuperTokens 的 `/api/auth/*`）。
#
# 为什么是 `/api` 而不是按面列举（`^/(auth|consult|profile|memory|library)`）——
# 那是 2026-10-01 实测到的缺陷：正则 location 的优先级高于 SPA 的 `location /`，
# 而前端**页面路由**用了同样的前缀（`/consult`、`/profile`、`/consult/emergency`），
# 于是这些页面被转发给 API（实测 404/405 JSON），用户打开对话页或档案页看到的是
# 裸 API 错误。现在接口在 `/api/consult`、页面在 `/consult`，结构上不可能再相撞；
# 也不再需要「新增一个面就要记得改这条正则」。
#
# 前缀大小写敏感是刻意的：`/API/...` 不该被当作接口。
location /api/ {
    proxy_pass         http://$campfire_api;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    # 协议要传给后端：SuperTokens 据它做 cookie 的 secure 判定，
    # 缺了它 https 站点会拿到非 secure cookie。
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection "";
}

# `/api` 本身（无尾斜杠）也转给后端，让它回后端的 404 而不是落到 SPA
# （落到 SPA 会返回 index.html 200，让一个拼错的前缀看起来「通了」）。
location = /api {
    proxy_pass         http://$campfire_api;
    proxy_set_header   Host $host;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

# SPA：其余路径交给前端路由（React Router），未命中的文件回 index.html。
location / {
    root       /usr/share/nginx/html;
    index      index.html;
    try_files  $uri $uri/ /index.html;

    # index.html 不缓存：它引用 hashed 资源，缓存它会让用户长期用旧版本。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}

# hashed 静态资源可长期缓存（内容变了文件名就变）。
location /assets/ {
    root               /usr/share/nginx/html;
    expires            1y;
    add_header         Cache-Control "public, immutable" always;
    access_log         off;
}
